<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circuit | Austin Way</title>
  <meta name="description" content="Footage from Circuit, Austin Way’s Minecraft server, and the Roblox game that followed it.">
  <meta name="theme-color" content="#0f1217">
  <meta property="og:title" content="Circuit | Austin Way">
  <meta property="og:image" content="/media/hero-reel.jpg">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/ibm-plex-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#minecraft">Skip to videos</a>

  <header class="bar">
    <a class="wordmark" href="#top" aria-label="Circuit, back to top">
      <svg class="wordmark__mark" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="1" width="5" height="5"/>
        <rect x="10" y="10" width="5" height="5"/>
        <path d="M3.5 6v4.5H10" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>Circuit</span>
    </a>
    <nav aria-label="Sections">
      <ul class="bar__nav">
        <li><a href="#minecraft">Minecraft</a></li>
        <li><a href="#roblox">Roblox</a></li>
      </ul>
    </nav>
  </header>

  <main id="top">
    <h1 class="visually-hidden">Circuit</h1>

    <section class="deck" id="minecraft" aria-labelledby="minecraft-title" data-clips-src="/media/clips-minecraft.json">
      <h2 class="deck__label" id="minecraft-title">Minecraft</h2>
      <ul class="deck__grid"></ul>
    </section>

    <section class="deck" id="roblox" aria-labelledby="roblox-title" data-clips-src="/media/clips-roblox.json">
      <h2 class="deck__label" id="roblox-title">Roblox</h2>
      <ul class="deck__grid"></ul>
    </section>
  </main>
</body>
</html>
